<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Web Slinger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 1200px;
            height: 700px;
            margin: 0 auto;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden;
            border: 3px solid #333;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
        }

        .ui-container {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 100;
            min-width: 200px;
        }

        .stat-line {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .health-bar {
            width: 150px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 5px;
            overflow: hidden;
            margin-left: 10px;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff6600);
            width: 100%;
            transition: width 0.2s;
        }

        .instructions {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffff00;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            max-width: 600px;
        }

        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            color: white;
            font-size: 48px;
            text-align: center;
        }

        .game-over.show {
            display: flex;
        }

        .game-over-text {
            margin: 20px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000;
        }

        .restart-button {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 24px;
            background: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .restart-button:hover {
            background: #ff6600;
            transform: scale(1.1);
        }

        .score-display {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffff00;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="ui-container">
        <div class="stat-line">
            <span>Health:</span>
            <div class="health-bar">
                <div class="health-fill" id="healthBar"></div>
            </div>
        </div>
        <div class="stat-line">
            <span>Web Energy:</span>
            <span id="webEnergy">100</span>
        </div>
        <div class="stat-line">
            <span>Criminals Caught:</span>
            <span id="criminalsCaught">0</span>
        </div>
    </div>

    <div class="score-display">
        Score: <span id="score">0</span>
    </div>

    <div class="instructions">
        ← → Arrow Keys to Move | SPACE to Shoot Web | Hold Left Click on a Building to Swing | Hold E for Spider-Sense | Catch Criminals • Avoid Enemy Fire
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-text" id="gameOverText">GAME OVER</div>
        <div style="font-size: 32px; margin: 20px;">Score: <span id="finalScore">0</span></div>
        <button class="restart-button" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 700;

        // Game States
        const gameState = {
            health: 100,
            maxHealth: 100,
            webEnergy: 100,
            maxWebEnergy: 100,
            score: 0,
            criminalsCaught: 0,
            gameOver: false,
            level: 1
        };

        // Spider-Man Player
        class Player {
            constructor() {
                this.x = 100;
                this.y = 300;
                this.width = 30;
                this.height = 40;
                this.vx = 0;
                this.vy = 0;
                this.isSwinging = false;
                this.swingAnchorX = null;
                this.swingAnchorY = null;
                this.swingDistance = 0;
                this.swingAngle = 0;
                this.swingRopeLength = 0;
                this.webShootCooldown = 0;
                this.isGrounded = false;
                this.facing = 1; // 1 for right, -1 for left
            }

            update(keys) {
                // Horizontal movement
                if (keys['ArrowLeft']) {
                    this.vx = -8;
                    this.facing = -1;
                } else if (keys['ArrowRight']) {
                    this.vx = 8;
                    this.facing = 1;
                } else {
                    this.vx *= 0.85;
                }

                // Gravity and swinging
                if (this.isSwinging) {
                    this.updateSwing();
                } else {
                    this.vy += 0.6; // Gravity
                    this.y += this.vy;
                    this.x += this.vx;

                    resolveBuildingCollisions(this);

                    // Ground collision
                    if (this.y > canvas.height - 50) {
                        this.y = canvas.height - 50;
                        this.vy = 0;
                        this.isGrounded = true;
                    } else {
                        this.isGrounded = false;
                    }
                }

                // Boundary checks - DIE if fall off map
                if (this.y > canvas.height + 100) {
                    gameState.gameOver = true;
                    gameState.health = 0;
                }

                if (this.x < -50) {
                    this.x = canvas.width + 50;
                } else if (this.x > canvas.width + 50) {
                    this.x = -50;
                }

                // Cooldowns
                if (this.webShootCooldown > 0) {
                    this.webShootCooldown--;
                }

                // Web energy regeneration
                if (gameState.webEnergy < gameState.maxWebEnergy) {
                    gameState.webEnergy = Math.min(gameState.webEnergy + 0.3, gameState.maxWebEnergy);
                }
            }

            getBounds() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }

            updateSwing() {
                const dx = this.x - this.swingAnchorX;
                const dy = this.y - this.swingAnchorY;
                this.swingDistance = Math.sqrt(dx * dx + dy * dy);

                if (this.swingDistance > 0) {
                    // Gravity and a steady pull toward the held pointer create the swing.
                    this.vx += (this.swingAnchorX - this.x) / this.swingDistance * 0.7;
                    this.vy += (this.swingAnchorY - this.y) / this.swingDistance * 0.7;
                }

                this.vy += 0.25;
                this.vx *= 0.995;
                this.vy *= 0.995;
                this.x += this.vx;
                this.y += this.vy;

                // Keep the web taut, while preserving sideways momentum for swinging.
                const newDx = this.x - this.swingAnchorX;
                const newDy = this.y - this.swingAnchorY;
                const newDistance = Math.sqrt(newDx * newDx + newDy * newDy);
                if (newDistance > this.swingRopeLength) {
                    const normalX = newDx / newDistance;
                    const normalY = newDy / newDistance;
                    this.x = this.swingAnchorX + normalX * this.swingRopeLength;
                    this.y = this.swingAnchorY + normalY * this.swingRopeLength;

                    const outwardVelocity = this.vx * normalX + this.vy * normalY;
                    if (outwardVelocity > 0) {
                        this.vx -= outwardVelocity * normalX;
                        this.vy -= outwardVelocity * normalY;
                    }
                }

                resolveBuildingCollisions(this);
            }

            startSwing(anchorX, anchorY) {
                this.swingAnchorX = anchorX;
                this.swingAnchorY = anchorY;
                this.swingRopeLength = Math.max(80, getDistance(this.x, this.y, anchorX, anchorY));
                this.isSwinging = true;
            }

            endSwing() {
                this.isSwinging = false;
            }

            shoot(targetX, targetY) {
                if (this.webShootCooldown <= 0 && gameState.webEnergy >= 15) {
                    gameState.webEnergy -= 15;
                    this.webShootCooldown = 15;
                    return {
                        x: this.x,
                        y: this.y,
                        targetX: targetX,
                        targetY: targetY
                    };
                }
                return null;
            }

            draw() {
                // Head
                ctx.fillStyle = '#ff6644';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 5, this.y - 2, 3, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(this.x - 10, this.y + 10, 20, 20);

                // Legs
                ctx.fillStyle = '#0033cc';
                ctx.fillRect(this.x - 8, this.y + 30, 8, 15);
                ctx.fillRect(this.x, this.y + 30, 8, 15);

                // Draw swing web if swinging
                if (this.isSwinging) {
                    ctx.strokeStyle = 'rgba(200, 200, 200, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(this.swingAnchorX, this.swingAnchorY);
                    ctx.lineTo(this.x, this.y);
                    ctx.stroke();
                }
            }
        }

        // Building class
        class Building {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
            }

            contains(x, y) {
                return x >= this.x && x <= this.x + this.width &&
                       y >= this.y && y <= this.y + this.height;
            }

            draw() {
                // Building body
                ctx.fillStyle = '#888888';
                ctx.fillRect(this.x, this.y, this.width, this.height);

                // Windows
                ctx.fillStyle = '#ffff99';
                for (let i = 0; i < this.width / 30; i++) {
                    for (let j = 0; j < this.height / 30; j++) {
                        ctx.fillRect(
                            this.x + 5 + i * 30,
                            this.y + 5 + j * 30,
                            15,
                            15
                        );
                    }
                }

                // Border
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
            }
        }

        // Web projectile
        class WebProjectile {
            constructor(startX, startY, targetX, targetY) {
                this.x = startX;
                this.y = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.vx = (targetX - startX) * 0.08;
                this.vy = (targetY - startY) * 0.08;
                this.lifetime = 200;
                this.radius = 5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.lifetime--;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.lifetime / 200})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // Glow
                ctx.strokeStyle = `rgba(200, 200, 200, ${this.lifetime / 300})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            isAlive() {
                return this.lifetime > 0;
            }
        }

        // Criminal Enemy
        class Criminal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.width = 25;
                this.height = 35;
                this.vx = -3 + Math.random() * 6;
                this.vy = 0;
                this.health = 30;
                this.maxHealth = 30;
                this.lastShotTime = 0;
                this.shootCooldown = 300; // 5 seconds in frames (at 60fps)
                this.isStunned = false;
                this.stunDuration = 0;
            }

            update() {
                // Movement
                this.x += this.vx;
                this.vy += 0.5;
                this.y += this.vy;

                // Ground collision
                if (this.y > canvas.height - 50) {
                    this.y = canvas.height - 50;
                    this.vy = 0;
                }

                // Wrap around screen
                if (this.x < -50) {
                    this.x = canvas.width + 50;
                } else if (this.x > canvas.width + 50) {
                    this.x = -50;
                }

                // Shoot cooldown
                if (this.lastShotTime > 0) {
                    this.lastShotTime--;
                }

                // Stun
                if (this.isStunned) {
                    this.stunDuration--;
                    if (this.stunDuration <= 0) {
                        this.isStunned = false;
                    }
                }
            }

            shoot() {
                if (this.lastShotTime <= 0 && !this.isStunned) {
                    this.lastShotTime = this.shootCooldown;
                    return true;
                }
                return false;
            }

            takeDamage(amount) {
                this.health -= amount;
            }

            stun(duration) {
                this.isStunned = true;
                this.stunDuration = duration;
            }

            draw() {
                if (this.isStunned) {
                    ctx.fillStyle = '#ffff00';
                } else {
                    ctx.fillStyle = '#ff0000';
                }

                // Body
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);

                // Head
                ctx.beginPath();
                ctx.arc(this.x, this.y - 8, 10, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(this.x - 4, this.y - 10, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y - 10, 2, 0, Math.PI * 2);
                ctx.fill();

                // Health bar
                const barWidth = 30;
                const barHeight = 3;
                ctx.fillStyle = '#333';
                ctx.fillRect(this.x - barWidth / 2, this.y - 25, barWidth, barHeight);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x - barWidth / 2, this.y - 25, (this.health / this.maxHealth) * barWidth, barHeight);
            }

            getBounds() {
                return {
                    x: this.x - this.width / 2,
                    y: this.y,
                    width: this.width,
                    height: this.height
                };
            }
        }

        // Bullet from criminal
        class EnemyBullet {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.vx = (targetX - x) * 0.05;
                this.vy = (targetY - y) * 0.05;
                this.radius = 4;
                this.lifetime = 400;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.lifetime--;
            }

            draw() {
                ctx.fillStyle = 'rgba(255, 255, 0, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 200, 0, 0.9)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + 2, 0, Math.PI * 2);
                ctx.stroke();
            }

            isAlive() {
                return this.lifetime > 0 && this.y >= 0 && this.y <= canvas.height;
            }

            getBounds() {
                return {
                    x: this.x - this.radius,
                    y: this.y - this.radius,
                    width: this.radius * 2,
                    height: this.radius * 2
                };
            }
        }

        // Initialize game
        const player = new Player();
        const buildings = [];
        const webProjectiles = [];
        const enemyBullets = [];
        const criminals = [];
        const keys = {};

        gameState.spiderSenseActive = false;

        player.x = 50;
        player.y = canvas.height - 50;

        // Create buildings
        for (let i = 0; i < 6; i++) {
            buildings.push(new Building(
                i * 250 + 100,
                canvas.height - 50 - 300,
                150,
                300
            ));
        }

        // Spawn initial criminals
        function spawnCriminal() {
            const x = Math.random() > 0.5 ? -30 : canvas.width + 30;
            const y = canvas.height - 100;
            criminals.push(new Criminal(x, y));
        }

        for (let i = 0; i < 3; i++) {
            spawnCriminal();
        }

        let spawnTimer = 0;

        // Input handling
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;

            if (e.key.toLowerCase() === 'e') {
                gameState.spiderSenseActive = true;
            }

            // Shoot web with space
            if (e.key === ' ') {
                e.preventDefault();
                const mouseX = canvas.width / 2;
                const mouseY = canvas.height / 2;
                const web = player.shoot(mouseX, mouseY);
                if (web) {
                    webProjectiles.push(new WebProjectile(web.x, web.y, web.targetX, web.targetY));
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;

            if (e.key.toLowerCase() === 'e') {
                gameState.spiderSenseActive = false;
            }
        });

        function getCanvasPosition(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * canvas.width / rect.width,
                y: (e.clientY - rect.top) * canvas.height / rect.height
            };
        }

        // Hold left click on a building to attach, steer, and swing.
        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) {
                return;
            }

            const position = getCanvasPosition(e);

            // Check if clicking on a building for swing
            let hitBuilding = false;
            for (let building of buildings) {
                if (building.contains(position.x, position.y)) {
                    player.startSwing(position.x, position.y);
                    hitBuilding = true;
                    break;
                }
            }

            // Otherwise shoot web at clicked position
            if (!hitBuilding) {
                const web = player.shoot(position.x, position.y);
                if (web) {
                    webProjectiles.push(new WebProjectile(web.x, web.y, position.x, position.y));
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!player.isSwinging) {
                return;
            }

            const position = getCanvasPosition(e);
            player.swingAnchorX = position.x;
            player.swingAnchorY = position.y;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                player.endSwing();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            player.endSwing();
        });

        window.addEventListener('mouseup', () => {
            player.endSwing();
        });

        // Collision detection
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function resolveBuildingCollisions(playerObject) {
            const previousBounds = {
                x: playerObject.x - playerObject.vx - playerObject.width / 2,
                y: playerObject.y - playerObject.vy,
                width: playerObject.width,
                height: playerObject.height
            };
            const playerBounds = playerObject.getBounds();

            for (const building of buildings) {
                const buildingBounds = {
                    x: building.x,
                    y: building.y,
                    width: building.width,
                    height: building.height
                };

                if (!checkCollision(playerBounds, buildingBounds)) {
                    continue;
                }

                if (previousBounds.y + previousBounds.height <= building.y) {
                    playerObject.y = building.y - playerObject.height;
                    playerObject.vy = 0;
                    playerObject.isGrounded = true;
                } else if (previousBounds.y >= building.y + building.height) {
                    playerObject.y = building.y + building.height;
                    playerObject.vy = 0;
                } else if (previousBounds.x + previousBounds.width <= building.x) {
                    playerObject.x = building.x - playerObject.width / 2;
                    playerObject.vx = 0;
                } else if (previousBounds.x >= building.x + building.width) {
                    playerObject.x = building.x + building.width + playerObject.width / 2;
                    playerObject.vx = 0;
                }

                playerBounds.x = playerObject.x - playerObject.width / 2;
                playerBounds.y = playerObject.y;
            }
        }

        function getDistance(x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function drawSpiderSense() {
            if (!gameState.spiderSenseActive) {
                return;
            }

            const pulse = 0.5 + Math.sin(performance.now() / 120) * 0.2;
            const senseRadius = 420;

            ctx.strokeStyle = `rgba(0, 255, 255, ${pulse})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(player.x, player.y + 15, senseRadius, 0, Math.PI * 2);
            ctx.stroke();

            for (const building of buildings) {
                const distance = getDistance(
                    player.x,
                    player.y,
                    building.x + building.width / 2,
                    building.y + building.height / 2
                );

                if (distance < senseRadius + building.width) {
                    ctx.strokeStyle = `rgba(0, 255, 255, ${pulse})`;
                    ctx.lineWidth = 5;
                    ctx.strokeRect(building.x - 4, building.y - 4, building.width + 8, building.height + 8);
                }
            }

            for (const criminal of criminals) {
                if (getDistance(player.x, player.y, criminal.x, criminal.y) < senseRadius) {
                    ctx.strokeStyle = `rgba(255, 40, 40, ${pulse})`;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.arc(criminal.x, criminal.y - 8, 18, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
        }

        // Update UI
        function updateUI() {
            document.getElementById('healthBar').style.width = (gameState.health / gameState.maxHealth) * 100 + '%';
            document.getElementById('webEnergy').textContent = Math.ceil(gameState.webEnergy);
            document.getElementById('criminalsCaught').textContent = gameState.criminalsCaught;
            document.getElementById('score').textContent = gameState.score;
        }

        // Game loop
        function gameLoop() {
            if (gameState.gameOver) {
                document.getElementById('gameOver').classList.add('show');
                document.getElementById('finalScore').textContent = gameState.score;
                return;
            }

            // Clear canvas
            ctx.fillStyle = 'rgba(135, 206, 235, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

            // Draw buildings
            for (let building of buildings) {
                building.draw();
            }

            // Update and draw player
            player.update(keys);
            player.draw();

            // Spawn criminals periodically
            spawnTimer++;
            if (spawnTimer > 180 + (gameState.level * 30)) { // Spawn every 3 seconds, faster with level
                spawnCriminal();
                spawnTimer = 0;
            }

            // Update and draw criminals
            for (let i = 0; i < criminals.length; i++) {
                let criminal = criminals[i];
                criminal.update();
                criminal.draw();

                // Criminals shoot at player
                if (criminal.shoot()) {
                    const bullet = new EnemyBullet(criminal.x, criminal.y, player.x, player.y);
                    enemyBullets.push(bullet);
                }

                // Check if criminal went off screen
                if (criminal.health <= 0 || criminal.x < -100 || criminal.x > canvas.width + 100) {
                    criminals.splice(i, 1);
                    if (criminal.health <= 0) {
                        gameState.criminalsCaught++;
                        gameState.score += 100;
                    }
                    i--;
                }
            }

            drawSpiderSense();

            // Update and draw web projectiles
            for (let i = 0; i < webProjectiles.length; i++) {
                let web = webProjectiles[i];
                web.update();
                web.draw();

                // Check collision with criminals
                for (let j = 0; j < criminals.length; j++) {
                    let criminal = criminals[j];
                    const distance = getDistance(web.x, web.y, criminal.x, criminal.y);
                    
                    if (distance < 20) {
                        criminal.takeDamage(35);
                        criminal.stun(60);
                        gameState.score += 25;
                        webProjectiles.splice(i, 1);
                        i--;
                        break;
                    }
                }

                // Remove if expired
                if (!web.isAlive()) {
                    webProjectiles.splice(i, 1);
                    i--;
                }
            }

            // Update and draw enemy bullets
            for (let i = 0; i < enemyBullets.length; i++) {
                let bullet = enemyBullets[i];
                bullet.update();
                bullet.draw();

                // Check collision with player
                const distance = getDistance(bullet.x, bullet.y, player.x, player.y);
                if (distance < 20) {
                    gameState.health -= 10;
                    enemyBullets.splice(i, 1);
                    i--;

                    if (gameState.health <= 0) {
                        gameState.gameOver = true;
                    }
                }

                // Remove if expired
                if (!bullet.isAlive()) {
                    enemyBullets.splice(i, 1);
                    i--;
                }
            }

            // Check if player fell off bottom
            if (player.y > canvas.height + 100) {
                gameState.gameOver = true;
                gameState.health = 0;
            }

            // Level progression
            if (gameState.criminalsCaught > 0 && gameState.criminalsCaught % 10 === 0) {
                gameState.level = Math.floor(gameState.criminalsCaught / 10) + 1;
            }

            // Update UI
            updateUI();

            // Continue game loop
            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
